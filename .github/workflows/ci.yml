name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (scorer, date resolver, routing, prompt-leakage guard)
        run: python -m pytest -q
      - name: Offline eval gate (rule-based extractor, no API key)
        run: python -m evals.run --engine heuristic --gate --quiet

  model-evals:
    # Runs the Gemini suite only when a key is configured, so forks still get green CI.
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Gemini eval gate
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: python -m evals.run --engine gemini --workers 2 --gate --quiet --label ci
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.GEMINI_API_KEY != '' }}
        with:
          name: eval-results
          path: evals/results/ci.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
